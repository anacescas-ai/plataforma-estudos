    /* -------------------------------------------------------------------

       As questões têm dezenas de desenhos SVG desenhados à mão com cores
       claras (traços cinza-claro, texto branco etc) pensadas para ficar
       dentro de uma caixa escura. Se essa caixa virasse branca no modo
       claro, os desenhos ficariam praticamente invisíveis (traço claro
       sobre fundo claro). Por isso, toda caixa que envolve um <svg>
       (galeria e diagramaHtml) recebe a classe .svg-vitrine, que mantém
       fundo escuro e preserva as cores originais dos elementos internos,
       mesmo com o site no modo claro — é uma "vitrine escura" dentro da
       página clara.
       IMPORTANTE: antes usávamos um seletor `:has(svg)` sobre as classes
       genéricas bg-slate-950/900/900\/60 — mas como body/header/main
       também usam essas classes, e :has() casa com QUALQUER ancestral
       (não só o pai imediato), abrir a galeria de uma questão (inserindo
       um <svg> em qualquer lugar do DOM) fazia a página inteira voltar a
       ficar escura mesmo no modo claro. Agora usamos uma classe própria
       (.svg-vitrine), aplicada só nas caixas que realmente devem ficar
       sempre escuras, em vez de depender de :has(svg).

</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- ============================ HEADER ============================ -->

          <i class="fa-solid fa-book-open-reader text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white tracking-wide">Simulado Interativo</h1>

        <button onclick="alternarTema()" id="botaoTema"
          class="flex items-center justify-center w-8 h-8 rounded-lg bg-slate-950 border border-slate-800 text-slate-300 hover:text-white transition"
          title="Alternar entre modo claro e escuro">

    <!-- Filtros: Foco (Categoria) e Matérias -->
    <div class="border-t border-slate-800/80 bg-slate-950/80 px-4 py-2">

        <!-- Linha 1: Foco (ENEM, INSS, etc) -->

          <span class="text-slate-500 font-bold uppercase tracking-wider text-[10px] flex items-center gap-1 shrink-0 mr-1">
            <i class="fa-solid fa-layer-group text-purple-400"></i> Foco:
          </span>

  <!-- ============================ LAYOUT: ESTUDO ============================ -->
  <div id="viewEstudo" class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col md:flex-row gap-6">

    <!-- SIDEBAR -->
    <aside class="w-full md:w-80 flex-shrink-0 space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
        <div class="flex justify-between items-center text-xs">
          <span class="font-bold text-slate-300 uppercase tracking-wider">Acervo Didático</span>
          <span id="contadorQuestoes" class="px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 font-mono font-bold">0 itens</span>
        </div>
        <div class="relative">
          <input type="text" id="campoBusca" oninput="renderizarLista()" placeholder="Buscar por tema, matéria ou palavra-chave..."
                 class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-lg pl-8 pr-3 py-2 focus:border-blue-500 focus:outline-none"/>
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-500 text-xs"></i>

    <!-- WORKSPACE -->
    <main class="flex-1 bg-slate-900 rounded-2xl border border-slate-800 p-6 md:p-8 space-y-8 flex flex-col justify-between">

      <div class="pt-6 border-t border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-slate-500">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-lightbulb text-amber-400"></i>
          <span>Responda, estude a matéria completa, veja os esquemas e teste no laboratório.</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="inline-flex items-center gap-1 text-blue-400"><i class="fa-solid fa-book-open"></i> Resoluções completas</span>
          <span class="inline-flex items-center gap-1 text-emerald-400"><i class="fa-solid fa-floppy-disk"></i> Anotações salvas</span>
        </div>

  </div>

  <!-- ============================ LAYOUT: MEU PROGRESSO ============================ -->
  <div id="viewProgresso" class="hidden flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
    <div id="progressoConteudo"></div>
  </div>

  <!-- ============================ LAYOUT: SIMULADO ============================ -->
  <div id="viewSimulado" class="hidden flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
    <div id="simuladoConteudo"></div>
  </div>

  <!-- ============================ DADOS ============================ -->
  <script src="questoes.js"></script>

  <!-- ============================ LÓGICA ============================ -->
  <script>
  const Store = {
    chave: 'plataforma-estudos-v1',
    dados: { notas: {}, respostas: {} },

    carregar() {
      try {
        const bruto = localStorage.getItem(this.chave);
        if (bruto) this.dados = JSON.parse(bruto);
      } catch (e) {
        avisarStatus('Salvamento indisponível neste modo', false);
      }
      return this.dados;
    },

    salvar() {
      try {
        localStorage.setItem(this.chave, JSON.stringify(this.dados));
        avisarStatus('Salvo neste dispositivo', true);
      } catch (e) {
        avisarStatus('Não foi possível salvar', false);
      }
    },

    limpar() {
      this.dados = { notas: {}, respostas: {} };
      this.salvar();
    }
  };

  function avisarStatus(texto, ok) {
    document.getElementById('statusText').textContent = texto;
    document.getElementById('statusDot').className =
      'relative inline-flex rounded-full h-2.5 w-2.5 ' + (ok ? 'bg-emerald-500' : 'bg-amber-500');
  }

  function aplicarIconeTema() {
    const claro = document.documentElement.classList.contains('light');
    const icone = document.getElementById('iconeTema');
    if (icone) icone.className = claro ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    const botao = document.getElementById('botaoTema');
    if (botao) botao.title = claro ? 'Mudar para modo escuro' : 'Mudar para modo claro';
  }

  function alternarTema() {
    const claro = document.documentElement.classList.toggle('light');
    try { localStorage.setItem('plataforma-estudos-tema', claro ? 'light' : 'dark'); } catch (e) {}
    aplicarIconeTema();
    if (typeof painelAtivo !== 'undefined' && painelAtivo === 'progresso') renderizarProgresso();
  }

  let categoriaAtiva = 'ENEM'; 
  let materiaAtiva = 'todas';
  let questaoAtiva = null;
  let temporizadorNotas = null;
  let contextoAtivo = 'estudo';

  const CORES = {
    emerald: { texto: 'text-emerald-400', borda: 'border-emerald-500', fundo: 'bg-emerald-500/10', anel: 'hover:border-emerald-500 hover:text-emerald-400', solido: 'bg-emerald-600 text-white border-emerald-500' },
    cyan:    { texto: 'text-cyan-400',    borda: 'border-cyan-500',    fundo: 'bg-cyan-500/10',    anel: 'hover:border-cyan-500 hover:text-cyan-400',    solido: 'bg-cyan-600 text-white border-cyan-500' },
    purple:  { texto: 'text-purple-400',  borda: 'border-purple-500',  fundo: 'bg-purple-500/10',  anel: 'hover:border-purple-500 hover:text-purple-400',  solido: 'bg-purple-600 text-white border-purple-500' },
    blue:    { texto: 'text-blue-400',    borda: 'border-blue-500',    fundo: 'bg-blue-500/10',    anel: 'hover:border-blue-500 hover:text-blue-400',    solido: 'bg-blue-600 text-white border-blue-500' },
    amber:   { texto: 'text-amber-400',   borda: 'border-amber-500',   fundo: 'bg-amber-500/10',   anel: 'hover:border-amber-500 hover:text-amber-400',   solido: 'bg-amber-600 text-white border-amber-500' },
    lime:    { texto: 'text-lime-400',    borda: 'border-lime-500',    fundo: 'bg-lime-500/10',    anel: 'hover:border-lime-500 hover:text-lime-400',    solido: 'bg-lime-600 text-white border-lime-500' },
    red:     { texto: 'text-red-400',     borda: 'border-red-500',     fundo: 'bg-red-500/10',     anel: 'hover:border-red-500 hover:text-red-400',     solido: 'bg-red-600 text-white border-red-500' },
    pink:    { texto: 'text-pink-400',    borda: 'border-pink-500',    fundo: 'bg-pink-500/10',    anel: 'hover:border-pink-500 hover:text-pink-400',    solido: 'bg-pink-600 text-white border-pink-500' },
    violet:  { texto: 'text-violet-400',  borda: 'border-violet-500',  fundo: 'bg-violet-500/10',  anel: 'hover:border-violet-500 hover:text-violet-400',  solido: 'bg-violet-600 text-white border-violet-500' }
  };
  const cor = (c) => CORES[c] || CORES.purple;

  const CORMARCA = { texto: 'text-blue-400', borda: 'border-blue-500', fundo: 'bg-blue-500/10', anel: 'hover:border-blue-500 hover:text-blue-400', solido: 'bg-blue-600 text-white border-blue-500' };

  /* -------------------------------------------------------------------
     MONTAGEM DOS FILTROS A PARTIR DOS DADOS
     ------------------------------------------------------------------- */
  function montarFiltros() {
    const categorias = [];
    questaoDatabase.forEach(q => {
      const cat = q.categoria || 'ENEM'; 
      if (!categorias.includes(cat)) categorias.push(cat);
    });

    const alvoCat = document.getElementById('filtroCategorias');
    alvoCat.innerHTML = categorias.map(c => `
      <button onclick="filtrarCategoria('${c}')" data-cat="${c}"
        class="shrink-0 px-4 py-1.5 rounded-full border transition font-bold flex items-center gap-2">
        ${c.toUpperCase() === 'ENEM' ? '<i class="fa-solid fa-graduation-cap"></i>' : '<i class="fa-solid fa-briefcase"></i>'} ${c}
      </button>`).join('');

    const materias = [];
    questaoDatabase.forEach(q => {
      const cat = q.categoria || 'ENEM';
      if (cat === categoriaAtiva || categoriaAtiva === 'todas') {
        if (!materias.some(m => m.id === q.materiaId)) {
          materias.push({ id: q.materiaId, nome: q.materia.split(' / ')[0], cor: q.materiaCor, icone: q.materiaIcone });
        }
      }
    });

    const alvoMat = document.getElementById('filtroMaterias');
    alvoMat.innerHTML =
      `<button onclick="filtrarMateria('todas')" data-mat="todas"
         class="shrink-0 px-3 py-1 rounded-full border transition font-medium flex items-center gap-1.5">
         <i class="fa-solid fa-cubes"></i> Todas
       </button>` +
      materias.map(m => `
        <button onclick="filtrarMateria('${m.id}')" data-mat="${m.id}" data-cor="${m.cor}"
          class="shrink-0 px-3 py-1 rounded-full border transition font-medium flex items-center gap-1.5">
          <i class="fa-solid ${m.icone} ${cor(m.cor).texto}"></i> ${m.nome}
        </button>`).join('');

    const anos = [...new Set(questaoDatabase.map(q => q.ano))].sort().reverse();
    const select = document.getElementById('selectAno');
    select.innerHTML = '<option value="todos">Todas as edições</option>' +
      anos.map(a => `<option value="${a}">Edição ${a}</option>`).join('');

    pintarFiltros();
  }

  function pintarFiltros() {
    document.querySelectorAll('#filtroCategorias button').forEach(b => {
      const ativo = b.dataset.cat === categoriaAtiva;
      b.className = 'shrink-0 px-4 py-1.5 rounded-full border transition font-bold flex items-center gap-2 ' +
        (ativo ? 'bg-purple-600 text-white border-purple-500 shadow-sm' : 'border-slate-800 text-slate-300 hover:border-purple-500 hover:text-purple-400 bg-slate-900/50');
    });

    document.querySelectorAll('#filtroMaterias button').forEach(b => {
      const ativo = b.dataset.mat === materiaAtiva;
      const c = b.dataset.mat === 'todas' ? CORMARCA : cor(b.dataset.cor);
      b.className = 'shrink-0 px-3 py-1 rounded-full border transition font-medium flex items-center gap-1.5 ' +
        (ativo ? c.solido + ' shadow-sm'
               : 'border-slate-800 text-slate-300 ' + c.anel);
    });
  }

  function filtrarCategoria(cat) {
    categoriaAtiva = cat;
    materiaAtiva = 'todas'; 
    montarFiltros(); 
    renderizarLista();
  }

  function filtrarMateria(id) {
    materiaAtiva = id;
    pintarFiltros();
    renderizarLista();
  }

  /* -------------------------------------------------------------------
     LISTA LATERAL
     ------------------------------------------------------------------- */
  function questoesFiltradas() {
    const busca = document.getElementById('campoBusca').value.toLowerCase().trim();
    const ano = document.getElementById('selectAno').value;

    return questaoDatabase.filter(q => {
      const cat = q.categoria || 'ENEM';
      if (cat !== categoriaAtiva && categoriaAtiva !== 'todas') return false; 
      if (materiaAtiva !== 'todas' && q.materiaId !== materiaAtiva) return false; 
      if (ano !== 'todos' && q.ano !== ano) return false;
      if (!busca) return true;
      const texto = (q.titulo + ' ' + q.materia + ' ' + q.numero + ' ' + q.tags.join(' ')).toLowerCase();
      return texto.includes(busca);
    });
  }

  function renderizarLista() {
    const lista = questoesFiltradas();
    document.getElementById('contadorQuestoes').textContent =
      lista.length + (lista.length === 1 ? ' item' : ' itens');

    const alvo = document.getElementById('listaQuestoes');

    if (lista.length === 0) {
      alvo.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 text-center space-y-2">
          <i class="fa-solid fa-magnifying-glass text-slate-600 text-2xl"></i>
          <p class="text-xs text-slate-400">Nenhuma questão com esse filtro.</p>
          <button onclick="limparFiltros()" class="text-xs text-blue-400 font-bold hover:underline">Limpar filtros</button>
        </div>`;
      return;
    }

    alvo.innerHTML = lista.map(q => {
      const c = cor(q.materiaCor);
      const resposta = Store.dados.respostas[q.id];
      const selo = resposta
        ? (resposta.acertou
            ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>'
            : '<i class="fa-solid fa-circle-xmark text-rose-400"></i>')
        : '<i class="fa-regular fa-circle text-slate-600"></i>';
      const ativa = questaoAtiva && questaoAtiva.id === q.id;

      return `
        <button onclick="abrirQuestao('${q.id}')"
          class="w-full text-left p-3 rounded-xl border transition ${ativa ? c.borda + ' ' + c.fundo : 'border-slate-800 bg-slate-900 hover:border-slate-700'}">
          <div class="flex items-center justify-between mb-1">
            <span class="text-[10px] font-bold uppercase tracking-wider ${c.texto}">
              <i class="fa-solid ${q.materiaIcone}"></i> ${q.materia.split(' / ')[0]}
            </span>
            <span class="text-[10px] text-slate-500">${selo} ${q.numero}</span>
          </div>
          <p class="text-xs text-slate-300 leading-snug line-clamp-3">${q.titulo}</p>
          <div class="flex gap-1.5 mt-1.5 text-[9px] text-slate-600">
            ${q.materiaCompleta ? '<span title="Matéria completa"><i class="fa-solid fa-book"></i></span>' : ''}
            ${q.galeria && q.galeria.length ? `<span title="${q.galeria.length} esquemas"><i class="fa-solid fa-images"></i> ${q.galeria.length}</span>` : ''}
            ${q.simulador ? '<span title="Laboratório interativo" class="text-blue-500"><i class="fa-solid fa-flask"></i></span>' : ''}
          </div>
        </button>`;
    }).join('');
  }

  function limparFiltros() {
    document.getElementById('campoBusca').value = '';
    document.getElementById('selectAno').value = 'todos';
    materiaAtiva = 'todas';
    pintarFiltros();
    renderizarLista();
  }

  /* -------------------------------------------------------------------
     PAINEL DA QUESTÃO
     ------------------------------------------------------------------- */
  function abrirQuestao(id) {
    contextoAtivo = 'estudo';
    questaoAtiva = questaoDatabase.find(q => q.id === id);
    abaAtiva = 'questao';
    renderizarLista();
    renderizarQuestao();
  }

  let abaAtiva = 'questao';

  function abasDisponiveis(q) {
    const abas = [{ id: 'questao', nome: 'Questão', icone: 'fa-file-lines' }];
    if (q.materiaCompleta) abas.push({ id: 'materia', nome: 'Matéria completa', icone: 'fa-book' });
    abas.push({ id: 'resolucao', nome: 'Resolução comentada', icone: 'fa-book-open' });
    if (q.galeria && q.galeria.length) abas.push({ id: 'galeria', nome: 'Galeria', icone: 'fa-images' });
    if (q.simulador) abas.push({ id: 'lab', nome: 'Laboratório', icone: 'fa-flask' });
    return abas;
  }

  function trocarAba(id) {
    abaAtiva = id;
    renderizarQuestao();
  }

  function renderizarQuestao() {
    const q = questaoAtiva;
    const alvo = document.getElementById(contextoAtivo === 'simulado' ? 'painelSimuladoQuestao' : 'painelQuestao');
    if (!alvo) return;

    if (!q) {
      alvo.innerHTML = `
        <div class="h-full flex flex-col items-center justify-center text-center py-16 space-y-3">
          <i class="fa-solid fa-hand-pointer text-slate-700 text-4xl"></i>
          <p class="text-sm text-slate-400 font-medium">Escolha uma questão na lista ao lado para começar.</p>
          <p class="text-xs text-slate-600">${questaoDatabase.length} questões disponíveis no acervo.</p>
        </div>`;
      return;
    }

    const c = cor(q.materiaCor);
    const resposta = Store.dados.respostas[q.id];
    const nota = Store.dados.notas[q.id] || '';
    const abas = abasDisponiveis(q);
    if (!abas.some(a => a.id === abaAtiva)) abaAtiva = 'questao';

    alvo.innerHTML = `
      <div class="space-y-6">

        <div class="space-y-3">
          <div class="flex flex-wrap items-center gap-2 text-[10px]">
            <span class="px-2 py-1 rounded-lg border ${c.borda} ${c.fundo} ${c.texto} font-bold uppercase tracking-wider">
              <i class="fa-solid ${q.materiaIcone}"></i> ${q.materia}
            </span>
            <span class="px-2 py-1 rounded-lg bg-slate-950 border border-slate-800 text-slate-400">${q.numero} · ${q.ano}</span>
            <span class="px-2 py-1 rounded-lg bg-slate-950 border border-slate-800 text-slate-400">${q.areaNome}</span>
            <span class="px-2 py-1 rounded-lg bg-slate-950 border border-slate-800 text-slate-500">${q.caderno}</span>
          </div>
          <h2 class="text-lg font-bold text-white leading-snug">${q.titulo}</h2>
        </div>

        <div class="flex flex-wrap gap-1.5 border-b border-slate-800 pb-3">
          ${abas.map(a => `
            <button onclick="trocarAba('${a.id}')"
              class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-2 ${
                abaAtiva === a.id
                  ? 'bg-blue-600 text-white'
                  : 'bg-slate-950 text-slate-400 border border-slate-800 hover:text-slate-200 hover:border-slate-700'
              }">
              <i class="fa-solid ${a.icone}"></i> ${a.nome}
            </button>`).join('')}
        </div>

        <div id="conteudoAba">${montarAba(q, resposta)}</div>

        <div class="space-y-2 pt-2">
          <label for="campoNotas" class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square text-amber-400"></i> Minhas anotações
          </label>
          <textarea id="campoNotas" rows="4" oninput="salvarNota()"
            placeholder="O que você quer lembrar dessa questão? Onde errou? Que fórmula revisar?"
            class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl p-3 focus:border-amber-500 focus:outline-none resize-y">${nota}</textarea>
          <p id="avisoNota" class="text-[10px] text-slate-600 h-3"></p>
        </div>
      </div>`;

    if (abaAtiva === 'lab' && q.simulador && typeof q.simulador.init === 'function') {
      try {
        q.simulador.init(document.getElementById('painelLaboratorio'));
      } catch (e) {
        document.getElementById('painelLaboratorio').insertAdjacentHTML('afterbegin',
          '<p class="text-xs text-rose-400 mb-2">O laboratório desta questão não pôde ser carregado.</p>');
      }
    }

    typesetMath(alvo);
  }

  function montarAba(q, resposta) {
    if (abaAtiva === 'materia') {
      return `<div class="bg-slate-950 border border-slate-800 rounded-xl p-5">${q.materiaCompleta}</div>`;
    }

    if (abaAtiva === 'resolucao') {
      if (!resposta) {
        return `
          <div class="space-y-4">
            <div class="p-4 rounded-xl border border-amber-500/40 bg-amber-950/20 text-xs text-amber-200 flex items-start gap-3">
              <i class="fa-solid fa-lightbulb text-amber-400 text-lg mt-0.5"></i>
              <span>Você ainda não respondeu. Tentar antes de ler faz a resolução render muito mais — mas a escolha é sua.</span>
            </div>
            <button onclick="liberarResolucao()"
              class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition flex items-center gap-2">
              <i class="fa-solid fa-eye"></i> Ver a resolução mesmo assim
            </button>
          </div>`;
      }
      return `<div class="space-y-5">${q.diagramaHtml || ''}${q.resolucaoHtml || ''}${montarConceitos(q)}</div>`;
    }

    if (abaAtiva === 'galeria') {
      return `
        <div class="space-y-4">
          ${q.galeria.map((img, i) => `
            <figure class="bg-slate-950 svg-vitrine border border-slate-800 rounded-xl p-4 space-y-3">
              <figcaption class="flex items-center gap-2 text-xs font-bold text-slate-200">
                <span class="w-5 h-5 rounded bg-blue-600 text-white text-[10px] flex items-center justify-center font-mono">${i + 1}</span>
                ${img.titulo}
              </figcaption>
              <div class="bg-slate-900/60 svg-vitrine rounded-lg p-2">${img.svg}</div>
              <p class="text-[11px] text-slate-400 leading-relaxed border-l-2 border-slate-700 pl-3">${img.legenda}</p>
            </figure>`).join('')}
        </div>`;
    }

    if (abaAtiva === 'lab') {
      return `
        <div class="space-y-3">
          <div class="space-y-1">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
              <i class="fa-solid fa-flask text-blue-400"></i> ${q.simulador.titulo}
            </h3>
            <p class="text-xs text-slate-400 leading-relaxed">${q.simulador.descricao}</p>
          </div>
          <div id="painelLaboratorio">${q.simulador.html}</div>
        </div>`;
    }

    return `
      <div class="space-y-6">
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-5 text-sm text-slate-200 leading-relaxed">
          ${q.enunciado}
        </div>

        <div class="space-y-2">
          ${q.alternativas.map(a => montarAlternativa(q, a, resposta)).join('')}
        </div>

        ${resposta ? montarFeedback(q, resposta) : ''}

        ${resposta ? `
        <div class="flex flex-wrap gap-2">
          <button onclick="trocarAba('resolucao')"
            class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition flex items-center gap-2">
            <i class="fa-solid fa-book-open"></i> Ver resolução comentada
          </button>
          <button onclick="refazerQuestao()"
            class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition flex items-center gap-2">
            <i class="fa-solid fa-rotate-left"></i> Responder de novo
          </button>
        </div>` : ''}
      </div>`;
  }

  function liberarResolucao() {
    const q = questaoAtiva;
    const alvo = document.getElementById('conteudoAba');
    alvo.innerHTML = `<div class="space-y-5">${q.diagramaHtml || ''}${q.resolucaoHtml || ''}${montarConceitos(q)}</div>`;
    typesetMath(alvo);
  }

  function montarAlternativa(q, a, resposta) {
    let estilo = 'border-slate-800 bg-slate-950 hover:border-slate-600';
    let icone = `<span class="w-6 h-6 rounded-lg bg-slate-900 border border-slate-700 flex items-center justify-center text-[11px] font-bold text-slate-400">${a.letra}</span>`;

    if (resposta) {
      if (a.correta) {
        estilo = 'border-emerald-500 bg-emerald-500/10';
        icone = `<span class="w-6 h-6 rounded-lg bg-emerald-500 flex items-center justify-center text-[11px] font-bold text-white">${a.letra}</span>`;
      } else if (a.letra === resposta.letra) {
        estilo = 'border-rose-500 bg-rose-500/10';
        icone = `<span class="w-6 h-6 rounded-lg bg-rose-500 flex items-center justify-center text-[11px] font-bold text-white">${a.letra}</span>`;
      } else {
        estilo = 'border-slate-800 bg-slate-950 opacity-50';
      }
    }

    return `
      <button ${resposta ? 'disabled' : `onclick="responder('${a.letra}')"`}
        class="w-full text-left p-3 rounded-xl border transition flex items-start gap-3 ${estilo}">
        ${icone}
        <span class="text-xs text-slate-200 leading-relaxed pt-1">${a.texto}</span>
      </button>`;
  }

  function montarFeedback(q, resposta) {
    return resposta.acertou
      ? `<div class="p-4 rounded-xl border border-emerald-500/40 bg-emerald-950/40 text-xs text-emerald-200 flex items-center gap-3">
           <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
           <span><strong>Acertou.</strong> Vale abrir a resolução mesmo assim: confira se o seu raciocínio foi o mesmo.</span>
         </div>`
      : `<div class="p-4 rounded-xl border border-rose-500/40 bg-rose-950/40 text-xs text-rose-200 flex items-center gap-3">
           <i class="fa-solid fa-circle-xmark text-rose-400 text-lg"></i>
           <span>Você marcou <strong>${resposta.letra}</strong>; o gabarito é <strong>${q.alternativaCorreta}</strong>. A resolução explica onde o caminho se separa.</span>
         </div>`;
  }

  function montarConceitos(q) {
    if (!q.conceitos || !q.conceitos.length) return '';
    const c = cor(q.materiaCor);
    return `
      <div class="space-y-2">
        <span class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-lightbulb ${c.texto}"></i> Conceitos-chave
        </span>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
          ${q.conceitos.map(k => `
            <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
              <span class="text-[11px] font-bold ${c.texto} flex items-center gap-1.5">
                <i class="fa-solid ${k.icone}"></i> ${k.titulo}
              </span>
              <p class="text-[11px] text-slate-400 leading-relaxed">${k.text}</p>
            </div>`).join('')}
        </div>
      </div>`;
  }

  /* -------------------------------------------------------------------
     AÇÕES
     ------------------------------------------------------------------- */
  function responder(letra) {
    const q = questaoAtiva;
    Store.dados.respostas[q.id] = { letra: letra, acertou: letra === q.alternativaCorreta };
    Store.salvar();
    atualizarPlacar();
    if (letra !== q.alternativaCorreta) abaAtiva = 'resolucao';
    renderizarQuestao();
    if (contextoAtivo === 'estudo') renderizarLista();
  }

  function refazerQuestao() {
    delete Store.dados.respostas[questaoAtiva.id];
    Store.salvar();
    atualizarPlacar();
    renderizarQuestao();
    if (contextoAtivo === 'estudo') renderizarLista();
  }

  function salvarNota() {
    const texto = document.getElementById('campoNotas').value;
    const aviso = document.getElementById('avisoNota');
    aviso.textContent = 'Salvando...';
    clearTimeout(temporizadorNotas);
    temporizadorNotas = setTimeout(() => {
      Store.dados.notas[questaoAtiva.id] = texto;
      Store.salvar();
      aviso.textContent = 'Anotação salva.';
      setTimeout(() => { aviso.textContent = ''; }, 2000);
    }, 600);
  }

  function atualizarPlacar() {
    const r = Object.values(Store.dados.respostas);
    document.getElementById('placarAcertos').textContent = r.filter(x => x.acertou).length;
    document.getElementById('placarErros').textContent = r.filter(x => !x.acertou).length;
  }

  function zerarProgresso() {
    Store.limpar();
    atualizarPlacar();
    renderizarLista();
    renderizarQuestao();
    if (painelAtivo === 'progresso') renderizarProgresso();
  }

  /* -------------------------------------------------------------------
     MEU PROGRESSO
     ------------------------------------------------------------------- */
  let painelAtivo = 'estudo';
  let chartGeralInst = null, chartMateriaInst = null, chartEdicaoInst = null;

  const CORES_HEX = {
    emerald: '#34d399', cyan: '#22d3ee', purple: '#c084fc', blue: '#60a5fa',
    amber: '#fbbf24', lime: '#a3e635', red: '#f87171', pink: '#f472b6', violet: '#a78bfa'
  };

  function pintarAbasPrincipais() {
    const ativa = 'bg-blue-600 text-white border-blue-500';
    const inativa = 'border-slate-800 text-slate-300 hover:border-blue-500 hover:text-blue-400';
    document.getElementById('botaoAbaEstudo').className =
      'px-3 py-1.5 rounded-lg border text-xs font-bold transition flex items-center gap-1.5 ' + (painelAtivo === 'estudo' ? ativa : inativa);
    document.getElementById('botaoAbaSimulado').className =
      'px-3 py-1.5 rounded-lg border text-xs font-bold transition flex items-center gap-1.5 ' + (painelAtivo === 'simulado' ? ativa : inativa);
    document.getElementById('botaoAbaProgresso').className =
      'px-3 py-1.5 rounded-lg border text-xs font-bold transition flex items-center gap-1.5 ' + (painelAtivo === 'progresso' ? ativa : inativa);
  }

  function mostrarEstudo() {
    painelAtivo = 'estudo';
    contextoAtivo = 'estudo';
    document.getElementById('viewEstudo').classList.remove('hidden');
    document.getElementById('viewSimulado').classList.add('hidden');
    document.getElementById('viewProgresso').classList.add('hidden');
    pintarAbasPrincipais();
  }

  function mostrarProgresso() {
    painelAtivo = 'progresso';
    document.getElementById('viewEstudo').classList.add('hidden');
    document.getElementById('viewSimulado').classList.add('hidden');
    document.getElementById('viewProgresso').classList.remove('hidden');
    pintarAbasPrincipais();
    renderizarProgresso();
  }

  function mostrarSimulado() {
    painelAtivo = 'simulado';
    document.getElementById('viewEstudo').classList.add('hidden');
    document.getElementById('viewProgresso').classList.add('hidden');
    document.getElementById('viewSimulado').classList.remove('hidden');
    pintarAbasPrincipais();
    if (simuladoTela === 'rodando' && simulado) {
      contextoAtivo = 'simulado';
      questaoAtiva = questaoDatabase.find(q => q.id === simulado.questoesIds[simulado.indice]);
    }
    renderizarSimulado();
  }

  function calcularEstatisticas() {
    const total = questaoDatabase.length;
    const respostas = Store.dados.respostas;
    const idsRespondidos = Object.keys(respostas);
    const respondidas = idsRespondidos.length;
    const acertos = idsRespondidos.filter(id => respostas[id].acertou).length;
    const erros = respondidas - acertos;

    const porMateriaMapa = {};
    const porEdicaoMapa = {};

    questaoDatabase.forEach(q => {
      if (!porMateriaMapa[q.materiaId]) {
        porMateriaMapa[q.materiaId] = { nome: q.materia.split(' / ')[0], cor: q.materiaCor, total: 0, respondidas: 0, acertos: 0 };
      }
      const m = porMateriaMapa[q.materiaId];
      m.total++;

      const chaveEdicao = q.ano;
      if (!porEdicaoMapa[chaveEdicao]) {
        porEdicaoMapa[chaveEdicao] = { nome: 'Edição ' + chaveEdicao, total: 0, respondidas: 0, acertos: 0 };
      }
      const ed = porEdicaoMapa[chaveEdicao];
      ed.total++;

      const r = respostas[q.id];
      if (r) {
        m.respondidas++;
        ed.respondidas++;
        if (r.acertou) { m.acertos++; ed.acertos++; }
      }
    });

    return {
      total, respondidas, acertos, erros,
      percConclusao: total ? Math.round(respondidas / total * 100) : 0,
      percAcerto: respondidas ? Math.round(acertos / respondidas * 100) : 0,
      porMateria: Object.values(porMateriaMapa).sort((a, b) => b.total - a.total),
      porEdicao: Object.values(porEdicaoMapa).sort((a, b) => String(a.nome).localeCompare(String(b.nome)))
    };
  }

  function cartaoStat(rotulo, valor, icone, corClasse) {
    return `
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-1">
        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid ${icone} ${corClasse}"></i> ${rotulo}
        </span>
        <p class="text-xl font-bold text-white">${valor}</p>
      </div>`;
  }

  function linhaProgresso(item) {
    const c = cor(item.cor || 'blue');
    const percConclusao = item.total ? Math.round(item.respondidas / item.total * 100) : 0;
    const percAcerto = item.respondidas ? Math.round(item.acertos / item.respondidas * 100) : 0;
    return `
      <div class="space-y-1">
        <div class="flex items-center justify-between text-xs">
          <span class="font-bold text-slate-200">${item.nome}</span>
          <span class="text-slate-500">${item.respondidas}/${item.total} respondidas · ${percAcerto}% de acerto</span>
        </div>
        <div class="h-2 rounded-full bg-slate-800 overflow-hidden">
          <div class="h-full ${c.fundo.replace('/10', '')} rounded-full" style="width:${percConclusao}%"></div>
        </div>
      </div>`;
  }

  function corEixoGrafico() {
    return document.documentElement.classList.contains('light') ? '#334155' : '#cbd5e1';
  }
  function corGradeGrafico() {
    return document.documentElement.classList.contains('light') ? '#e2e8f0' : '#1e293b';
  }

  function renderizarProgresso() {
    const e = calcularEstatisticas();
    const alvo = document.getElementById('progressoConteudo');

    if (e.total === 0) {
      alvo.innerHTML = '<p class="text-sm text-slate-400">Nenhuma questão no acervo ainda.</p>';
      return;
    }

    alvo.innerHTML = `
      <div>
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-chart-pie text-blue-400"></i> Meu progresso
        </h2>
        <p class="text-xs text-slate-400 mt-1">O quanto você já estudou e sua taxa de acerto — no geral, por matéria e por edição.</p>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        ${cartaoStat('Questões no acervo', e.total, 'fa-layer-group', 'text-slate-300')}
        ${cartaoStat('Respondidas', e.respondidas + ' (' + e.percConclusao + '%)', 'fa-pen', 'text-blue-400')}
        ${cartaoStat('Acertos', e.acertos, 'fa-circle-check', 'text-emerald-400')}
        ${cartaoStat('Taxa de acerto', e.percAcerto + '%', 'fa-bullseye', 'text-purple-400')}
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-2xl p-5">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3">Geral: acertos x erros x pendentes</h3>
          <canvas id="graficoGeral" height="220"></canvas>
        </div>
        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-5">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3">Taxa de acerto por matéria</h3>
          <canvas id="graficoMateria" height="220"></canvas>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3">Taxa de acerto por edição (simulado)</h3>
        <canvas id="graficoEdicao" height="180"></canvas>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Detalhe por matéria</h3>
          ${e.porMateria.map(m => linhaProgresso(m)).join('')}
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Detalhe por edição</h3>
          ${e.porEdicao.map(ed => linhaProgresso(ed)).join('')}
        </div>
      </div>
    `;

    desenharGraficos(e);
  }

  function desenharGraficos(e) {
    if (typeof Chart === 'undefined') return; 
    const eixoCor = corEixoGrafico();
    const gradeCor = corGradeGrafico();

    if (chartGeralInst) chartGeralInst.destroy();
    const ctxGeral = document.getElementById('graficoGeral');
    if (ctxGeral) {
      const pendentes = e.total - e.respondidas;
      chartGeralInst = new Chart(ctxGeral, {
        type: 'doughnut',
        data: {
          labels: ['Acertos', 'Erros', 'Não respondidas'],
          datasets: [{ data: [e.acertos, e.erros, pendentes], backgroundColor: ['#34d399', '#fb7185', '#475569'], borderWidth: 0 }]
        },
        options: {
          plugins: { legend: { position: 'bottom', labels: { color: eixoCor, boxWidth: 12, font: { size: 11 } } } }
        }
      });
    }

    if (chartMateriaInst) chartMateriaInst.destroy();
    const ctxMateria = document.getElementById('graficoMateria');
    if (ctxMateria) {
      chartMateriaInst = new Chart(ctxMateria, {
        type: 'bar',
        data: {
          labels: e.porMateria.map(m => m.nome),
          datasets: [{
            label: '% de acerto',
            data: e.porMateria.map(m => m.respondidas ? Math.round(m.acertos / m.respondidas * 100) : 0),
            backgroundColor: e.porMateria.map(m => CORES_HEX[m.cor] || CORES_HEX.blue),
            borderRadius: 6
          }]
        },
        options: {
          scales: {
            y: { min: 0, max: 100, ticks: { color: eixoCor, callback: v => v + '%' }, grid: { color: gradeCor } },
            x: { ticks: { color: eixoCor }, grid: { display: false } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    if (chartEdicaoInst) chartEdicaoInst.destroy();
    const ctxEdicao = document.getElementById('graficoEdicao');
    if (ctxEdicao) {
      chartEdicaoInst = new Chart(ctxEdicao, {
        type: 'bar',
        data: {
          labels: e.porEdicao.map(ed => ed.nome),
          datasets: [{
            label: '% de acerto',
            data: e.porEdicao.map(ed => ed.respondidas ? Math.round(ed.acertos / ed.respondidas * 100) : 0),
            backgroundColor: '#60a5fa',
            borderRadius: 6
          }]
        },
        options: {
          indexAxis: 'y',
          scales: {
            x: { min: 0, max: 100, ticks: { color: eixoCor, callback: v => v + '%' }, grid: { color: gradeCor } },
            y: { ticks: { color: eixoCor }, grid: { display: false } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }
  }

  /* =========================================================================
     SIMULADO PERSONALIZADO
     ========================================================================= */
  let simMateriasSel = new Set();
  let simCadernosSel = new Set();
  let simOrigem = 'todas'; 
  let simQuantidade = 20;
  let simCronometroAtivo = false;
  let simMinutos = 60;

  let simulado = null; 
  let simuladoTela = 'montar'; 

  function materiasDisponiveis() {
    const materias = [];
    questaoDatabase.forEach(q => {
      const cat = q.categoria || 'ENEM';
      if (cat === categoriaAtiva || categoriaAtiva === 'todas') {
        if (!materias.some(m => m.id === q.materiaId)) {
          materias.push({ id: q.materiaId, nome: q.materia.split(' / ')[0], cor: q.materiaCor, icone: q.materiaIcone });
        }
      }
    });
    return materias;
  }

  function cadernosDisponiveis() {
    const cadernos = [];
    questaoDatabase.forEach(q => {
      const cat = q.categoria || 'ENEM';
      if (cat === categoriaAtiva || categoriaAtiva === 'todas') {
        const chave = q.ano + '||' + q.caderno;
        if (!cadernos.some(c => c.chave === chave)) {
          cadernos.push({ chave: chave, rotulo: q.caderno + ' · ' + q.ano });
        }
      }
    });
    return cadernos;
  }

  function toggleSimMateria(id) {
    if (simMateriasSel.has(id)) simMateriasSel.delete(id); else simMateriasSel.add(id);
    renderizarSimulado();
  }

  function toggleSimCaderno(chave) {
    if (simCadernosSel.has(chave)) simCadernosSel.delete(chave); else simCadernosSel.add(chave);
    renderizarSimulado();
  }

  function definirSimOrigem(valor) {
    simOrigem = valor;
    renderizarSimulado();
  }

  function definirSimQuantidade(valor) {
    simQuantidade = Math.max(1, parseInt(valor, 10) || 1);
    renderizarSimulado();
  }

  function alternarSimCronometro() {
    simCronometroAtivo = !simCronometroAtivo;
    renderizarSimulado();
  }

  function definirSimMinutos(valor) {
    simMinutos = Math.max(1, parseInt(valor, 10) || 1);
  }

  function questoesPoolSimulado() {
    return questaoDatabase.filter(q => {
      const cat = q.categoria || 'ENEM';
      if (cat !== categoriaAtiva && categoriaAtiva !== 'todas') return false;
      if (simMateriasSel.size && !simMateriasSel.has(q.materiaId)) return false;
      if (simCadernosSel.size && !simCadernosSel.has(q.ano + '||' + q.caderno)) return false;
      const origem = q.origem || 'oficial';
      if (simOrigem !== 'todas' && origem !== simOrigem) return false;
      return true;
    });
  }

  function embaralhar(lista) {
    const copia = lista.slice();
    for (let i = copia.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = copia[i]; copia[i] = copia[j]; copia[j] = tmp;
    }
    return copia;
  }

  function formatarTempo(segundos) {
    segundos = Math.max(0, segundos);
    const m = Math.floor(segundos / 60);
    const s = segundos % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function iniciarSimulado() {
    const pool = questoesPoolSimulado();
    if (!pool.length) return;
    const quantidade = Math.min(simQuantidade, pool.length);
    const escolhidas = embaralhar(pool).slice(0, quantidade);

    if (simulado && simulado.intervalId) clearInterval(simulado.intervalId);

    simulado = {
      questoesIds: escolhidas.map(q => q.id),
      indice: 0,
      segundosRestantes: simCronometroAtivo ? simMinutos * 60 : null,
      intervalId: null
    };

    contextoAtivo = 'simulado';
    questaoAtiva = questaoDatabase.find(q => q.id === simulado.questoesIds[0]);
    abaAtiva = 'questao';
    simuladoTela = 'rodando';

    if (simCronometroAtivo) {
      simulado.intervalId = setInterval(simuladoTick, 1000);
    }

    renderizarSimulado();
  }

  function simuladoTick() {
    if (!simulado || simulado.segundosRestantes === null) return;
    simulado.segundosRestantes--;
    const el = document.getElementById('simuladoCronometro');
    if (el) {
      el.textContent = formatarTempo(simulado.segundosRestantes);
      el.className = 'font-mono font-bold ' + (simulado.segundosRestantes <= 60 ? 'text-rose-400' : 'text-slate-200');
    }
    if (simulado.segundosRestantes <= 0) finalizarSimulado();
  }

  function irParaQuestaoSimulado(indice) {
    if (!simulado) return;
    if (indice < 0 || indice >= simulado.questoesIds.length) return;
    simulado.indice = indice;
    questaoAtiva = questaoDatabase.find(q => q.id === simulado.questoesIds[indice]);
    abaAtiva = 'questao';
    renderizarSimulado();
  }

  function simuladoAnterior() { irParaQuestaoSimulado(simulado.indice - 1); }
  function simuladoProxima() { irParaQuestaoSimulado(simulado.indice + 1); }

  function finalizarSimulado() {
    if (!simulado) return;
    if (simulado.intervalId) clearInterval(simulado.intervalId);
    simulado.intervalId = null;
    simuladoTela = 'resultado';
    renderizarSimulado();
  }

  function revisarSimulado() {
    if (!simulado) return;
    simuladoTela = 'rodando';
    contextoAtivo = 'simulado';
    simulado.indice = 0;
    questaoAtiva = questaoDatabase.find(q => q.id === simulado.questoesIds[0]);
    abaAtiva = 'questao';
    renderizarSimulado();
  }

  function novoSimulado() {
    simulado = null;
    simuladoTela = 'montar';
    contextoAtivo = 'estudo';
    renderizarSimulado();
  }

  function renderizarSimulado() {
    if (simuladoTela === 'rodando' && simulado) return renderizarSimuladoRodando();
    if (simuladoTela === 'resultado' && simulado) return renderizarSimuladoResultado();
    return renderizarSimuladoMontagem();
  }

  function renderizarSimuladoMontagem() {
    const materias = materiasDisponiveis();
    const cadernos = cadernosDisponiveis();
    const pool = questoesPoolSimulado();
    const totalInedita = questaoDatabase.filter(q => (q.origem || 'oficial') === 'inedita').length;
    const alvo = document.getElementById('simuladoConteudo');
    if (!alvo) return;

    alvo.innerHTML = `
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 space-y-6">
        <div class="space-y-1">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-stopwatch text-blue-400"></i> Monte seu simulado
          </h2>
          <p class="text-xs text-slate-400">Escolha as matérias, edições e quantas questões você quer treinar agora.</p>
        </div>

        <div class="space-y-2">
          <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Matérias (${simMateriasSel.size || 'todas'})</span>
          <div class="flex flex-wrap gap-2">
            ${materias.map(m => {
              const ativo = simMateriasSel.has(m.id);
              const c = cor(m.cor);
              return `<button onclick="toggleSimMateria('${m.id}')"
                class="px-3 py-1.5 rounded-full border text-xs font-medium transition flex items-center gap-1.5 ${
                  ativo ? c.solido + ' shadow-sm' : 'border-slate-800 text-slate-300 ' + c.anel
                }">
                <i class="fa-solid ${m.icone}"></i> ${m.nome}
              </button>`;
            }).join('')}
          </div>
          <p class="text-[10px] text-slate-600">Nenhuma selecionada = todas as matérias entram. Pode escolher mais de uma.</p>
        </div>

        <div class="space-y-2">
          <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Cadernos / edições (${simCadernosSel.size || 'todos'})</span>
          <div class="flex flex-wrap gap-2 max-h-32 overflow-y-auto pr-1">
            ${cadernos.map(c => {
              const ativo = simCadernosSel.has(c.chave);
              return `<button onclick="toggleSimCaderno('${c.chave}')"
                class="px-3 py-1.5 rounded-full border text-xs font-medium transition ${
                  ativo ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'border-slate-800 text-slate-300 hover:border-blue-500 hover:text-blue-400'
                }">
                ${c.rotulo}
              </button>`;
            }).join('')}
          </div>
          <p class="text-[10px] text-slate-600">Nenhum selecionado = todos os cadernos entram.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="space-y-2">
            <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Origem das questões</span>
            <div class="flex flex-col gap-1.5">
              ${[['todas', 'Oficiais + inéditas'], ['oficial', 'Só oficiais (provas reais)'], ['inedita', 'Só inéditas (criadas por IA)']].map(par => `
                <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                  <input type="radio" name="simOrigem" value="${par[0]}" ${simOrigem === par[0] ? 'checked' : ''} onchange="definirSimOrigem('${par[0]}')">
                  ${par[1]}
                </label>`).join('')}
            </div>
            ${totalInedita === 0 ? '<p class="text-[10px] text-slate-600">Ainda não há questões inéditas no banco — assim que forem criadas, aparecem aqui.</p>' : ''}
          </div>

          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-300 uppercase tracking-wider flex justify-between">
              <span>Quantidade de questões</span><span class="text-blue-400 font-mono">${Math.min(simQuantidade, Math.max(1, pool.length))}</span>
            </label>
            <input type="range" min="1" max="${Math.max(1, pool.length)}" value="${Math.min(simQuantidade, Math.max(1, pool.length))}"
              oninput="definirSimQuantidade(this.value)" class="w-full accent-blue-500" ${pool.length === 0 ? 'disabled' : ''}>
            <p class="text-[10px] text-slate-600">${pool.length} questões disponíveis com esses filtros.</p>
          </div>

          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2 cursor-pointer">
              <input type="checkbox" ${simCronometroAtivo ? 'checked' : ''} onchange="alternarSimCronometro()">
              Cronometrar este simulado
            </label>
            ${simCronometroAtivo ? `
              <div class="flex items-center gap-2">
                <input type="number" min="1" value="${simMinutos}" oninput="definirSimMinutos(this.value)"
                  class="w-20 bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-lg px-2 py-1.5 focus:border-blue-500 focus:outline-none">
                <span class="text-xs text-slate-400">minutos no total</span>
              </div>` : `<p class="text-[10px] text-slate-600">Sem tempo — responda no seu ritmo.</p>`}
          </div>
        </div>

        <button onclick="iniciarSimulado()" ${pool.length === 0 ? 'disabled' : ''}
          class="w-full sm:w-auto px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-bold transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-play"></i> Iniciar simulado (${Math.min(simQuantidade, pool.length)} questões)
        </button>
      </div>`;
  }

  function renderizarSimuladoRodando() {
    const alvo = document.getElementById('simuladoConteudo');
    if (!alvo) return;
    const total = simulado.questoesIds.length;
    const indice = simulado.indice;

    alvo.innerHTML = `
      <div class="bg-slate-900 rounded-2xl border border-slate-800 p-6 md:p-8 space-y-6">
        <div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-800">
          <div class="flex items-center gap-3">
            <span class="px-3 py-1 rounded-lg bg-blue-500/10 border border-blue-500/40 text-blue-300 text-xs font-bold">
              Questão ${indice + 1} de ${total}
            </span>
            ${simulado.segundosRestantes !== null ? `
              <span class="px-3 py-1 rounded-lg bg-slate-950 border border-slate-800 flex items-center gap-1.5 text-xs">
                <i class="fa-solid fa-stopwatch text-slate-400"></i>
                <span id="simuladoCronometro" class="font-mono font-bold text-slate-200">${formatarTempo(simulado.segundosRestantes)}</span>
              </span>` : ''}
          </div>
          <button onclick="finalizarSimulado()"
            class="px-3 py-1.5 rounded-lg border border-rose-500/40 text-rose-300 hover:bg-rose-500/10 text-xs font-bold transition flex items-center gap-1.5">
            <i class="fa-solid fa-flag-checkered"></i> Finalizar simulado
          </button>
        </div>

        <div id="painelSimuladoQuestao"></div>

        <div class="flex justify-between items-center pt-4 border-t border-slate-800">
          <button onclick="simuladoAnterior()" ${indice === 0 ? 'disabled' : ''}
            class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed text-slate-200 text-xs font-bold transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Anterior
          </button>
          ${indice === total - 1
            ? `<button onclick="finalizarSimulado()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition flex items-center gap-2">
                 Ver resultado <i class="fa-solid fa-flag-checkered"></i>
               </button>`
            : `<button onclick="simuladoProxima()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition flex items-center gap-2">
                 Próxima <i class="fa-solid fa-arrow-right"></i>
               </button>`}
        </div>
      </div>`;

    renderizarQuestao();
  }

  function renderizarSimuladoResultado() {
    const alvo = document.getElementById('simuladoConteudo');
    if (!alvo) return;
    const questoes = simulado.questoesIds.map(id => questaoDatabase.find(q => q.id === id)).filter(Boolean);
    const total = questoes.length;
    const respondidas = questoes.filter(q => Store.dados.respostas[q.id]);
    const acertos = respondidas.filter(q => Store.dados.respostas[q.id].acertou).length;
    const pct = total ? Math.round((acertos / total) * 100) : 0;

    const porMateria = {};
    questoes.forEach(q => {
      const nome = q.materia.split(' / ')[0];
      if (!porMateria[nome]) porMateria[nome] = { total: 0, acertos: 0, cor: q.materiaCor };
      porMateria[nome].total++;
      const r = Store.dados.respostas[q.id];
      if (r && r.acertou) porMateria[nome].acertos++;
    });

    alvo.innerHTML = `
      <div class="bg-slate-900 rounded-2xl border border-slate-800 p-6 md:p-8 space-y-6">
        <div class="text-center space-y-2">
          <i class="fa-solid fa-flag-checkered text-4xl text-blue-400"></i>
          <h2 class="text-lg font-bold text-white">Simulado finalizado!</h2>
          <p class="text-3xl font-bold ${pct >= 60 ? 'text-emerald-400' : pct >= 40 ? 'text-amber-400' : 'text-rose-400'}">${pct}%</p>
          <p class="text-xs text-slate-400">${acertos} acertos em ${total} questões (${respondidas.length} respondidas)</p>
        </div>

        <div class="space-y-2">
          <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Por matéria</span>
          <div class="space-y-2">
            ${Object.keys(porMateria).map(nome => {
              const d = porMateria[nome];
              const p = d.total ? Math.round((d.acertos / d.total) * 100) : 0;
              const c = cor(d.cor);
              return `
                <div class="space-y-1">
                  <div class="flex justify-between text-xs">
                    <span class="text-slate-300 font-medium">${nome}</span>
                    <span class="${c.texto} font-mono font-bold">${d.acertos}/${d.total} · ${p}%</span>
                  </div>
                  <div class="h-2 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                    <div class="h-full ${c.solido.split(' ')[0]}" style="width:${p}%"></div>
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>

        <div class="flex flex-wrap gap-2 pt-2">
          <button onclick="revisarSimulado()"
            class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass"></i> Revisar questões
          </button>
          <button onclick="novoSimulado()"
            class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition flex items-center gap-2">
            <i class="fa-solid fa-rotate"></i> Montar novo simulado
          </button>
        </div>
      </div>`;
  }

  function typesetMath(elemento) {
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise([elemento]).catch(() => {});
    }
  }

  /* -------------------------------------------------------------------
     INICIALIZAÇÃO
     ------------------------------------------------------------------- */
  (function iniciar() {
    if (typeof questaoDatabase === 'undefined' || !questaoDatabase.length) {
      document.getElementById('painelQuestao').innerHTML =
        '<p class="text-sm text-rose-400">O arquivo questoes.js não foi carregado. Confira se ele está na mesma pasta deste index.html.</p>';
      return;
    }
    aplicarIconeTema();
    Store.carregar();
    montarFiltros();
    renderizarLista();
    renderizarQuestao();
    atualizarPlacar();
    pintarAbasPrincipais();
  })();
  </script>
</body>
</html>
